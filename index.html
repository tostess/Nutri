<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Colo nutrição infantil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,800&display=swap" rel="stylesheet">
<style>
/* VOICE everyday-clinical and tender: calm for the mãe, precise for the nutricionista
   IDEA the Caderneta da Criança: one booklet shared between consultório and casa
   PICTURE the baby's growth line drawn large, each point coloured by the SBP gain verdict; a filling bottle for the plan
   COLOUR white ground, berry bands, apricot fields, leaf green for growth, status red/amber/green/indigo
   TYPE Baloo 2 display + Nunito Sans text
   LAYOUT nutri: patient rail + record with tabs; família: one phone column of cards */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#1b1317);--ink:light-dark(#2b1822,#f7e9ef);--mute:light-dark(#6f5b65,#c3aab6);--line:light-dark(#eedde5,#3b2a33);--soft:light-dark(#fbf4f7,#241a1f);--band:light-dark(#7d2a52,#3f1a2d);--berry:light-dark(#7d2a52,#f0a3c4);--apri:light-dark(#fde3d6,#3a251e);--apri-ink:light-dark(#8a3d1c,#ffc9ad);--leaf:light-dark(#2f8a57,#6fd39a);--ab:light-dark(#c2352b,#ff7b70);--at:light-dark(#a86f00,#f4c25a);--ok:light-dark(#2f8a57,#6fd39a);--ac:light-dark(#4153b8,#9aa8ff);--in:light-dark(#7d2a52,#f0a3c4)}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 "Nunito Sans",system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:"Baloo 2",system-ui,sans-serif;line-height:1.05;letter-spacing:-.01em;margin:0;text-wrap:balance}
h1{font-size:clamp(30px,4vw,42px)}
h2{font-size:22px}
h3{font-size:19px}
button,input,select,textarea{font:inherit;color:inherit}
.top{background:var(--band);color:#fff;padding:10px max(3vw,16px);display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;margin-right:auto}
.logo b{font:700 26px/1 "Baloo 2",sans-serif}
.logo span{font-size:14px;opacity:.85}
.roles{display:flex;background:rgba(255,255,255,.14);border-radius:999px;padding:4px}
.roles button{border:0;background:none;color:#fff;padding:8px 16px;border-radius:999px;min-height:40px;cursor:pointer;font-weight:600}
.roles button[aria-pressed=true]{background:#fff;color:#7d2a52}
.btn{border:1.5px solid var(--berry);background:var(--berry);color:var(--bg);border-radius:12px;padding:10px 16px;min-height:44px;font-weight:700;cursor:pointer}
.btn.ghost{background:none;color:var(--berry)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px}
.btn:focus-visible,.roles button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.tab:focus-visible,.pc:focus-visible{outline:3px solid var(--leaf);outline-offset:2px}
input,select,textarea{border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 11px;font-size:16px;width:100%;min-height:44px}
textarea{min-height:88px;resize:vertical}
label{display:block;font-size:14px;font-weight:600;color:var(--mute)}
label>input,label>select,label>textarea{margin-top:4px;color:var(--ink);font-weight:400}
.nut{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:calc(100vh - 60px)}
.rail{background:var(--soft);border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:8px}
.rail-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.pc{display:flex;gap:12px;align-items:center;text-align:left;width:100%;border:1.5px solid transparent;background:none;border-radius:14px;padding:10px;cursor:pointer}
.pc[aria-current=true]{background:var(--bg);border-color:var(--line);box-shadow:0 1px 0 var(--line)}
.av{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font:700 19px "Baloo 2",sans-serif;color:#fff}
.av.F{background:#c2547f}.av.M{background:#3f6fb5}.av.G{background:#7d2a52}.av.L{background:#b5632f}
.rg{margin:10px 4px 0;font-size:13px;font-weight:800;color:var(--mute)}
.lk{border:0;background:none;color:inherit;font:inherit;font-weight:800;text-decoration:underline;cursor:pointer;padding:0}
.meals{list-style:none;margin:0;padding:0}
.meals li{display:grid;grid-template-columns:4.2em minmax(0,1fr);gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.meals li:first-child{border-top:0}
.meals time{font:700 22px/1.1 "Baloo 2",sans-serif;color:var(--berry);white-space:nowrap}
.meals p{margin:2px 0 0}
.refrow{display:grid;grid-template-columns:130px minmax(0,1fr) minmax(0,2fr) auto;gap:8px;align-items:start;padding:8px 0;border-top:1px solid var(--line)}
.refrow textarea{min-height:44px}
@media(max-width:700px){.refrow{grid-template-columns:130px minmax(0,1fr)}.refrow textarea{grid-column:1/-1}}
.pc b{display:block;line-height:1.2}
.pc small{color:var(--mute);font-size:13px}
.dot{margin-left:auto;flex:none;min-width:22px;height:22px;border-radius:11px;background:var(--ab);color:#fff;font-size:12px;font-weight:800;display:grid;place-items:center;padding:0 6px}
.rec{padding:22px max(3vw,16px) 48px}
.rhead{display:flex;flex-wrap:wrap;gap:16px 32px;align-items:flex-end;justify-content:space-between;padding-bottom:16px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0;padding:0;list-style:none}
.meta li{background:var(--apri);color:var(--apri-ink);border-radius:999px;padding:3px 12px;font-size:14px;font-weight:600}
.kpis{display:flex;gap:22px;flex-wrap:wrap;align-items:flex-end}
.kpis div b{display:block;font:700 28px/1 "Baloo 2",sans-serif;white-space:nowrap}
.kpis div span{font-size:13px;color:var(--mute)}
.kpis small{flex-basis:100%;color:var(--mute);font-size:13px}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:2px solid var(--line);margin-bottom:20px}
.tab{border:0;background:none;padding:10px 14px;min-height:44px;font-weight:700;color:var(--mute);border-bottom:3px solid transparent;margin-bottom:-2px;cursor:pointer;white-space:nowrap}
.tab{flex:none}
.tabs{scrollbar-width:thin}
.gbar{height:10px;border-radius:5px;background:rgba(255,255,255,.2);margin-top:12px;overflow:hidden}
.gbar i{display:block;height:100%;background:#fde3d6;border-radius:5px}
.tab[aria-selected=true]{color:var(--berry);border-color:var(--berry)}
.tab i{font-style:normal;background:var(--ab);color:#fff;border-radius:9px;padding:0 6px;font-size:12px;margin-left:4px}
.grid2{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:18px;align-items:start}
.panel{border:1.5px solid var(--line);border-radius:18px;padding:18px;background:var(--bg)}
.panel+.panel,.grid2+.panel,.panel+.grid2{margin-top:18px}
.stackp{display:grid;gap:18px}
.ph{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.seg{display:flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{border:0;background:none;padding:6px 12px;min-height:38px;cursor:pointer;font-weight:600;font-size:14px}
.seg button[aria-pressed=true]{background:var(--berry);color:var(--bg)}
.fig{position:relative;min-height:330px}
.gs{align-items:stretch}
.chartp{display:flex;flex-direction:column}
.chartp .fig{flex:1}
.fig>svg{position:absolute;inset:0;width:100%;height:100%}
svg text{font:13px "Nunito Sans",sans-serif;fill:var(--mute);paint-order:stroke;stroke:var(--bg);stroke-width:4px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--mute);margin-top:6px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;background:currentColor;vertical-align:-1px}
.lg-ab{color:var(--ab)}.lg-at{color:var(--at)}.lg-ok{color:var(--ok)}.lg-ac{color:var(--ac)}
.chip{display:inline-block;border-radius:999px;padding:1px 10px;font-size:13px;font-weight:800;white-space:nowrap}
.ab{color:var(--ab);background:color-mix(in srgb,var(--ab) 13%,transparent)}
.at{color:var(--at);background:color-mix(in srgb,var(--at) 15%,transparent)}
.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent)}
.ac{color:var(--ac);background:color-mix(in srgb,var(--ac) 13%,transparent)}
.in{color:var(--in);background:color-mix(in srgb,var(--in) 11%,transparent)}
.alerts{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.alerts li{border-radius:12px;padding:9px 12px;font-size:14px;font-weight:600}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-size:13px;color:var(--mute);font-weight:700;padding:8px;border-bottom:1.5px solid var(--line);vertical-align:bottom}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.kv td.n{white-space:normal}
.kv td:first-child{color:var(--mute)}
.wide th,.wide td{white-space:nowrap}
.wide td.w{white-space:normal;min-width:12em}
.dim{color:var(--mute)}
.note{font-size:13px;color:var(--mute);margin:10px 0 0}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;align-items:end}
.form .full{grid-column:1/-1}
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(10em,1fr));gap:12px;margin-bottom:18px}
.fg{background:var(--soft);border-radius:16px;padding:14px 16px}
.fg b{display:block;font:700 clamp(28px,3.4vw,38px)/1 "Baloo 2",sans-serif;color:var(--berry);white-space:nowrap}
.fg span{font-size:14px;color:var(--mute)}
.eq{background:var(--apri);color:var(--apri-ink);border-radius:12px;padding:10px 14px;font-size:14px;overflow-wrap:anywhere}
.recipe{display:grid;grid-template-columns:120px minmax(0,1fr);gap:18px;align-items:center;background:var(--apri);border-radius:18px;padding:18px}
.recipe .big{font:700 clamp(30px,4vw,44px)/1 "Baloo 2",sans-serif;color:var(--apri-ink)}
.recipe p{margin:4px 0;color:var(--apri-ink)}
.bottle{width:120px;height:200px}
.liq{fill:light-dark(#ffffff,#f3e6d8);stroke:var(--apri-ink);stroke-width:2}
.glass{fill:none;stroke:var(--apri-ink);stroke-width:3}
.warn{border-radius:12px;padding:10px 14px;font-weight:600;font-size:14px;margin-top:10px}
details summary{cursor:pointer;font-weight:700;color:var(--berry);min-height:36px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;display:flex;gap:12px;align-items:center;z-index:9;font-weight:600;max-width:calc(100vw - 32px)}
.toast[hidden]{display:none}
.toast button{background:none;border:0;color:inherit;text-decoration:underline;font-weight:800;cursor:pointer}
.sample{font-size:13px;color:var(--mute);margin:0 0 12px}
/* família */
.fam{max-width:480px;margin:0 auto;padding-bottom:40px}
.fhero{background:var(--band);color:#fff;padding:18px 18px 22px;border-radius:0 0 28px 28px}
.fhero p{margin:0;opacity:.9}
.fhero h1{color:#fff;margin:6px 0 2px;font-size:40px}
.ftiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.ftiles div{background:rgba(255,255,255,.13);border-radius:14px;padding:10px}
.ftiles b{display:block;font:700 22px/1.1 "Baloo 2",sans-serif;white-space:nowrap}
.ftiles span{font-size:13px;opacity:.85}
.spark{width:100%;height:70px;margin-top:10px;display:block}
.fcards{display:grid;gap:14px;padding:16px}
.card{border:1.5px solid var(--line);border-radius:20px;padding:16px;background:var(--bg)}
.card.apri{background:var(--apri);border-color:transparent;color:var(--apri-ink)}
.card h2{margin-bottom:8px}
.mams{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.mam{width:44px;height:44px;border-radius:50%;border:2px dashed var(--berry);background:none;color:var(--berry);font-weight:800;cursor:pointer}
.mam[aria-pressed=true]{background:var(--berry);color:var(--bg);border-style:solid}
.chks{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.chks label{display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:999px;padding:6px 12px;color:var(--ink);font-weight:600;min-height:40px;cursor:pointer}
.chks input{width:18px;height:18px;min-height:0;margin:0;accent-color:#7d2a52}
.entry{border-top:1px solid var(--line);padding:10px 0}
.entry:first-of-type{border-top:0}
.entry p{margin:4px 0 0}
.ffam-pick{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--mute);padding:10px 16px 0}
.ffam-pick select{width:auto;min-height:36px;padding:4px 8px;font-size:14px}
@media(max-width:900px){.nut{grid-template-columns:minmax(0,1fr)}.rail>*{flex:none}.rail-h h2{display:none}.tabs{padding-right:40px;-webkit-mask-image:linear-gradient(90deg,#000 82%,transparent);mask-image:linear-gradient(90deg,#000 82%,transparent)}.rg{margin:0 0 0 10px;max-width:5.5em;line-height:1.15;font-size:12px}.rail{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:10px 12px;align-items:center}.rail-h{margin:0 6px 0 0;flex-direction:column;align-items:flex-start;gap:4px}.rail-h h2{font-size:17px}.pc{width:auto;flex:none;padding:6px 10px}.pc small{display:none}.grid2{grid-template-columns:minmax(0,1fr)}.rev>:last-child{order:-1}}
@media(max-width:600px){.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%}.kpis div b{font-size:22px}.kpis{align-items:start}.kpis small{grid-column:1/-1}.logo span{display:none}.fig{min-height:260px}table{font-size:13px}th,td{padding:6px 4px}.stack thead{display:none}.stack tr{display:grid;padding-block:8px;border-bottom:1px solid var(--line)}.stack td{display:flex;justify-content:space-between;gap:12px;border:0;padding:2px 0;text-align:right}.stack td::before{content:attr(data-l);color:var(--mute);text-align:left;font-weight:600}.stack td:empty{display:none}.recipe{grid-template-columns:90px minmax(0,1fr)}.bottle{width:90px;height:150px}}
@media(prefers-reduced-motion:no-preference){.liqr{transition:y .6s ease,height .6s ease}}
</style>
<script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>
</head>

<header class="top">
  <div class="logo"><svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="14" fill="#fde3d6"/><path d="M8 17c2 5 12 5 14 0" stroke="#7d2a52" stroke-width="2.6" fill="none" stroke-linecap="round"/><circle cx="15" cy="10" r="4" fill="#7d2a52"/></svg><b>Colo</b><span>Nutrição materno-infantil · protótipo</span></div>

</header>
<main id="app"></main>

<script>
{
/* ---------- utilidades ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const tt=new Date();const TODAY=`${tt.getFullYear()}-${pad(tt.getMonth()+1)}-${pad(tt.getDate())}`;
const pd=s=>{const [y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d)};
const days=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
const months=(a,b)=>{const [y1,m1,d1]=a.split('-').map(Number),[y2,m2,d2]=b.split('-').map(Number);let m=(y2-y1)*12+(m2-m1);if(d2<d1)m--;return m};
const addM=(a,n)=>{const [y,m,d]=a.split('-').map(Number);const dt=new Date(Date.UTC(y,m-1+n,1));const last=new Date(Date.UTC(dt.getUTCFullYear(),dt.getUTCMonth()+1,0)).getUTCDate();dt.setUTCDate(Math.min(d,last));return dt.toISOString().slice(0,10)};
const ageTxt=(a,b)=>{const m=months(a,b);if(m<0)return'—';const y=Math.floor(m/12),mm=m%12,dd=days(addM(a,m),b);const pl=(n,s,p)=>n+' '+(n===1?s:p);if(y)return pl(y,'ano','anos')+(mm?' e '+pl(mm,'mês','meses'):'');if(m)return pl(m,'mês','meses')+(dd?' e '+pl(dd,'dia','dias'):'');return pl(dd,'dia','dias')};
const ok=n=>n!=null&&isFinite(n);
const fmt=(n,d=1)=>ok(n)?n.toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d}):'—';
const dBR=s=>s?s.split('-').reverse().join('/'):'—';
const WD=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const wd=s=>WD[new Date(pd(s)).getUTCDay()];
const num=v=>{if(v===''||v==null)return null;const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:null};
const CL={Abaixo:'ab','Atenção':'at',Adequado:'ok',Acima:'ac'};
const chip=c=>c?`<span class="chip ${CL[c]}">${c}</span>`:'<span class="dim">—</span>';

/* ---------- tabelas de referência (da planilha) ---------- */

 {faixa:'0 a 3 meses',min:0,pMin:25,pMax:30,est:3.5,pc:2},

 {faixa:'10 a 12 meses',min:10,pMin:10,pMax:10,est:1,pc:.25},
 {faixa:'1 a 3 anos',min:12,pMin:8,pMax:8,est:1,pc:.25},
 {faixa:'4 a 9 anos',min:48,pMin:6,pMax:6,est:4/12,pc:1/12},
 {faixa:'10 anos ou mais',min:120,pMin:null,pMax:null,est:null,pc:null}];
const OMS={M:[[24.5,36.5,44],[30,40,50.5],[19.5,27,35.5],[14,20.5,28],[10.5,17.5,25],[7.5,14,21]],F:[[22,33.5,41.5],[25,33.5,45],[17,24,31.5],[13,20,26.5],[10,20,26.5],[7,13.5,20]]};
const EER_INF={M:[-716.45,-1,17.82,15.06],F:[-69.15,80,2.65,54.15]};
const EER_INF_K={M:[200,50,20,20],F:[180,60,20,15]};
const EER_NAF={M:{'Sedentário':[-447.51,3.68,13.01,13.15],'Pouco ativo':[19.12,3.68,8.62,20.28],'Ativo':[-388.19,3.68,12.66,20.46],'Muito ativo':[-671.75,3.68,15.38,23.25]},F:{'Sedentário':[55.59,-22.25,8.43,17.07],'Pouco ativo':[-297.54,-22.25,12.77,14.73],'Ativo':[-189.55,-22.25,11.74,18.34],'Muito ativo':[-709.59,-22.25,18.22,14.25]}};
const EER_K={M:[20,15,25,20],F:[15,15,30,20]};
const FX=['0-2,99 meses','3-5,99 meses','6-11,99 meses','1-2,99 anos','3-3,99 anos','4-8,99 anos','9-13,99 anos','14-18,99 anos'];
const GRP=['0-6 meses','7-12 meses','1-3 anos','4-18 anos','≥19 anos'];

  const R=REF[refIdx(r.idade)];r.faixa=R.faixa;
  r.cP=cls(r.gd,R.pMin,R.pMax,c);r.cE=cls(r.cm,R.est,R.est,c);r.cC=cls(r.pcm,R.pc,R.pc,c);

/* ---------- gráfico ---------- */
const niceStep=x=>{const p=10**Math.floor(Math.log10(x)),f=x/p;return(f<1.5?1:f<3?2:f<7?5:10)*p};
let ro;
function drawChart(){
 const el=$('#chart');if(!el)return;if(cur().tipo!=='crianca')return drawMom(el,cur());const p=cur(),key=S.serie,ck={peso:'cP',alt:'cE',pc:'cC'}[key],u={peso:'kg',alt:'cm',pc:'cm'}[key];
 const rs=rows(S,p).filter(r=>ok(r[key]));const W=el.clientWidth,H=el.clientHeight;if(!W||!rs.length){el.innerHTML='';return}
 const mg={l:46,r:64,t:16,b:36};const xs=rs.map(r=>days(p.nasc,r.data)/30.4375),ys=rs.map(r=>r[key]);
 const xmax=Math.max(1,Math.ceil(Math.max(...xs)+.6));let lo=Math.min(...ys),hi=Math.max(...ys);if(hi-lo<1e-9){lo-=1;hi+=1}
 const st=niceStep((hi-lo)/4),y0=Math.floor(lo/st)*st,y1=Math.ceil(hi/st)*st;
 const X=v=>mg.l+v/xmax*(W-mg.l-mg.r),Y=v=>H-mg.b-(v-y0)/(y1-y0)*(H-mg.t-mg.b);
 const xst=W<520?Math.max(2,Math.ceil(xmax/5)):Math.max(1,Math.ceil(xmax/10));
 let g='';for(let v=y0;v<=y1+1e-9;v+=st)g+=`<line x1="${mg.l}" x2="${W-mg.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${mg.l-8}" y="${Y(v)+4}" text-anchor="end">${fmt(v,st<1?1:0)}</text>`;
 for(let v=0;v<=xmax;v+=xst)g+=`<text x="${X(v)}" y="${H-mg.b+20}" text-anchor="middle">${v}${v===0?' m':''}</text>`;
 const pts=rs.map((r,i)=>[X(xs[i]),Y(ys[i])]);
 const line='M'+pts.map(q=>q.join(',')).join('L');const area=line+`L${pts[pts.length-1][0]},${H-mg.b}L${pts[0][0]},${H-mg.b}Z`;
 const dots=rs.map((r,i)=>`<circle cx="${pts[i][0]}" cy="${pts[i][1]}" r="${i===rs.length-1?7:5.5}" fill="${r[ck]?`var(--${CL[r[ck]]})`:'var(--bg)'}" stroke="${r[ck]?'var(--bg)':'var(--leaf)'}" stroke-width="2.5"><title>${dBR(r.data)}: ${fmt(r[key],key==='peso'?3:1)} ${u}${r[ck]?' · '+r[ck]:''}</title></circle>`).join('');
 const lp=pts[pts.length-1];
 el.innerHTML=`<svg viewBox="0 0 ${W} ${H}"><defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--leaf)" stop-opacity=".28"/><stop offset="1" stop-color="var(--leaf)" stop-opacity=".02"/></linearGradient></defs>${g}<path d="${area}" fill="url(#ga)"/><path d="${line}" fill="none" stroke="var(--leaf)" stroke-width="3" stroke-linejoin="round"/>${dots}<text x="${lp[0]+10}" y="${lp[1]+5}" style="font-weight:800;fill:var(--ink)">${fmt(ys[ys.length-1],key==='peso'?2:1)} ${u}</text></svg>`}

function drawMom(el,p){
 const W=el.clientWidth,H=el.clientHeight;if(!W)return;const G=p.tipo==='gestante',rs=momRows(p).filter(r=>ok(r.peso)),mg={l:46,r:70,t:22,b:36};
 let xs,ys,xmax,lo,hi,k;
 if(G){k=imcK(imc(p.pesoPre,p.altura));xs=rs.map(r=>r.sem);ys=rs.map(r=>r.dif);xmax=42;const pts=GWG[k];lo=Math.min(-2,...ys,...pts.map(x=>x[1]));hi=Math.max(...ys,...pts.map(x=>x[2]))+1}
 else{xs=rs.map(r=>r.pp/7);ys=rs.map(r=>r.peso);xmax=Math.max(8,Math.ceil(Math.max(0,...xs)/4)*4+4);lo=Math.min(p.pesoPre,...ys)-2;hi=Math.max(p.pesoPre,...ys)+2}
 const st=niceStep((hi-lo)/5),y0=Math.floor(lo/st)*st,y1=Math.ceil(hi/st)*st;
 const X=v=>mg.l+v/xmax*(W-mg.l-mg.r),Y=v=>H-mg.b-(v-y0)/(y1-y0)*(H-mg.t-mg.b);
 let g='';for(let v=y0;v<=y1+1e-9;v+=st)g+=`<line x1="${mg.l}" x2="${W-mg.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${mg.l-8}" y="${Y(v)+4}" text-anchor="end">${fmt(v,st<1?1:0)}</text>`;
 const xst=G?(W<520?10:4):(W<520?8:4);for(let v=0;v<=xmax;v+=xst)g+=`<text x="${X(v)}" y="${H-mg.b+20}" text-anchor="middle">${v}${v===0?' sem':''}</text>`;
 if(G){const pts=[[0,0,0],...GWG[k]];const up=pts.map(q=>`${X(q[0])},${Y(q[2])}`),dn=pts.slice().reverse().map(q=>`${X(q[0])},${Y(q[1])}`);
  g+=`<polygon points="${up.join(' ')} ${dn.join(' ')}" fill="var(--leaf)" fill-opacity=".18" stroke="var(--leaf)" stroke-opacity=".5"/>`;
  [[13,'2º tri'],[27,'3º tri']].forEach(([w,t])=>g+=`<line x1="${X(w)}" x2="${X(w)}" y1="${mg.t}" y2="${H-mg.b}" stroke="var(--line)" stroke-dasharray="4 4"/><text x="${X(w)+6}" y="${mg.t+2}">${t}</text>`);
  g+=`<line x1="${mg.l}" x2="${W-mg.r}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--mute)" stroke-opacity=".5"/>`}
 else g+=`<line x1="${mg.l}" x2="${W-mg.r}" y1="${Y(p.pesoPre)}" y2="${Y(p.pesoPre)}" stroke="var(--mute)" stroke-dasharray="6 5"/><text x="${W-mg.r+6}" y="${Y(p.pesoPre)+4}">pré</text>`;
 if(!rs.length){el.innerHTML=`<p class="dim" style="position:absolute;inset:0;display:grid;place-items:center;text-align:center;margin:0;padding:20px;border:1.5px dashed var(--line);border-radius:14px">Registre a primeira consulta${G?'':' após o parto'} para ver o gráfico.</p>`;return}
 const pts=rs.map((r,i)=>[X(xs[i]),Y(ys[i])]);const line='M'+pts.map(q=>q.join(',')).join('L');
 const dots=rs.map((r,i)=>{const c=G?`var(--${CL[r.cG]})`:'var(--berry)';return`<circle cx="${pts[i][0]}" cy="${pts[i][1]}" r="${i===rs.length-1?7:5.5}" fill="${c}" stroke="var(--bg)" stroke-width="2.5"><title>${dBR(r.data)}: ${G?sg(r.dif,1)+' kg':fmt(r.peso)+' kg'}</title></circle>`}).join('');
 const lp=pts[pts.length-1];
 el.innerHTML=`<svg viewBox="0 0 ${W} ${H}">${g}<path d="${line}" fill="none" stroke="${G?'var(--ink)':'var(--berry)'}" stroke-width="2.5" stroke-linejoin="round"/>${dots}<text x="${lp[0]+10}" y="${lp[1]+5}" style="font-weight:800;fill:var(--ink)">${G?sg(ys[ys.length-1],1):fmt(ys[ys.length-1])} kg</text></svg>`}

 else if(a==='tab')S.tab=v;
 else if(a==='serie')S.serie=v;
 else if(a==='delC'){const i=p.consultas.findIndex(c=>c.data===v);const [del]=p.consultas.splice(i,1);render();toast('Consulta de '+dBR(v)+' excluída.',()=>{p.consultas.push(del);render()});return}
 else if(a==='undo'){if(undo)undo();$('#toast').hidden=true;return}
 else if(a==='send'){sendPlan(S,p);toast('Plano enviado. A família já vê no app.')}
 else if(a==='addF'){S.formulas.push({nome:'Nova fórmula',kcal:null,prot:null,cho:null,lip:null,osm:null,origem:'preencher'})}
 else if(a==='reset'){S=sample();toast('Dados de exemplo restaurados.')}
 else if(a==='famgo'){S.famPid=v}
 else if(a==='addRef'){(p.refeicoes=p.refeicoes||[]).push(M('12:00','Nova refeição',''))}
 else if(a==='delRef'){const [del]=p.refeicoes.splice(+v,1);render();toast('Refeição removida.',()=>{p.refeicoes.splice(+v,0,del);render()});return}
 else if(a==='mam'){const f=fam();S.mam[f.id]=S.mam[f.id]||{};const arr=S.mam[f.id][TODAY]=S.mam[f.id][TODAY]||[];arr[+v]=!arr[+v]}
 render()});
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.id==='famSel'){S.famPid=t.value;render();return}
 if(t.id==='novoTipo'){S.novoTipo=t.value;render();return}
 if(t.dataset.ri){cur().refeicoes[+t.dataset.ri][t.dataset.rf]=t.value;render();return}
 let val=t.type==='number'?num(t.value):t.value;if(t.hasAttribute('data-pct')&&val!=null)val=val/100;
 if(t.dataset.k){const p=cur();if(t.dataset.k==='plano.vol'||val!=null||t.type!=='number')setPath(p,t.dataset.k,val);render()}
 else if(t.dataset.g){if(val!=null)setPath(S,t.dataset.g,val);render()}
 else if(t.dataset.fi){const f=S.formulas[+t.dataset.fi],k=t.dataset.ff,old=f.nome;f[k]=k==='nome'?val:num(t.value);if(k==='nome')S.pats.forEach(p=>{if(p.plano.formula===old)p.plano.formula=val});if(k!=='nome'&&f.origem==='preencher')f.origem='editado';render()}});
document.addEventListener('submit',e=>{
 e.preventDefault();const F=new FormData(e.target),p=cur(),id=e.target.id;
 if(id==='fCons'){const d=F.get('data');if(!d)return;const c={data:d,peso:num(F.get('peso')),alt:num(F.get('alt')),pc:num(F.get('pc')),obs:F.get('obs')||''};
  const i=p.consultas.findIndex(x=>x.data===d);if(i>=0)p.consultas[i]=c;else p.consultas.push(c);toast('Consulta registrada.')}
 else if(id==='fDiaN'){p.diario.push({id:Date.now(),data:F.get('data')||TODAY,peso:num(F.get('peso')),comp:num(F.get('comp')),pc:num(F.get('pc')),pt:num(F.get('pt')),sint:[],relato:F.get('relato')||'',autor:'nutri',lido:true});toast('Pesagem lançada.')}
 else if(id==='fDiaF'){const f=fam(),C=f.tipo==='crianca',w=num(F.get('peso'));f.diario.push({id:Date.now(),data:F.get('data')||TODAY,[C?'peso':'pesoKg']:w,sint:F.getAll('sint'),relato:F.get('relato')||'',autor:'familia',lido:false});toast('Enviado para a nutricionista.')}
 else if(id==='fConsM'){const d=F.get('data'),c={data:d,peso:num(F.get('peso')),obs:F.get('obs')||''};const i=p.consultas.findIndex(x=>x.data===d);if(i>=0)p.consultas[i]=c;else p.consultas.push(c);toast('Consulta registrada.')}
 else if(id==='fParto'){const bid='p'+Date.now(),d=F.get('data');S.pats.push({id:bid,tipo:'crianca',maeId:p.id,refeicoes:[],nome:F.get('nome'),nasc:d,sexo:F.get('sexo'),diag:'',resp:p.nome.split(' ')[0]+' (mãe)',naf:'Sedentário',prox:'',recado:'',consultas:[C(d,num(F.get('peso')),num(F.get('alt')),num(F.get('pc')))],plano:plano0({}),diario:[]});
  Object.assign(p,{tipo:'lactante',parto:d,amam:F.get('amam'),bebeId:bid,gestacao:{dum:p.dum,consultas:p.consultas},consultas:[]});S.tab='lact';toast('Parto registrado. Bebê cadastrado e ligado à mãe.')}
 else if(id==='fNovo'){const t=F.get('tipo'),nid='p'+Date.now();
  if(t==='crianca')S.pats.push({id:nid,tipo:'crianca',refeicoes:[],nome:F.get('nome'),nasc:F.get('nasc'),sexo:F.get('sexo'),diag:F.get('diag')||'',resp:F.get('resp')||'',naf:'Sedentário',prox:'',recado:'',consultas:[C(F.get('nasc'),num(F.get('peso')),num(F.get('alt')),num(F.get('pc')))],plano:plano0({}),diario:[]});
  else{const q={id:nid,tipo:t,nome:F.get('nome'),nasc:F.get('nasc'),altura:num(F.get('altura')),pesoPre:num(F.get('pesoPre')),naf:'Sedentário',prox:'',recado:'',refeicoes:[],diario:[],consultas:[]};if(t==='gestante')q.dum=F.get('dum');else{q.parto=F.get('parto');q.amam=F.get('amam')}const w=num(F.get('peso'));if(ok(w))q.consultas.push({data:TODAY,peso:w,obs:''});S.pats.push(q)}
  S.sel=nid;S.tab='';toast('Paciente cadastrada.')}
 render()});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h==='familia'||h==='nutricionista'){S.role=h==='familia'?'familia':'nutri';render()}});
function start(d){
 S=d&&d.pats?d:null;if(!S){try{const j=JSON.parse(localStorage.getItem(KEY));if(j&&j.v===2&&j.pats)S=j}catch(e){}}
 if(!S)S=sample();
 const h=location.hash.slice(1);if(h==='familia')S.role='familia';else if(h==='nutricionista')S.role='nutri';
 render()}
window.claude?.hot?.snapshot?.(()=>S);
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
window.__colo={rows:(p)=>rows(S,p),needs:(p)=>needs(S,p),plan:(p)=>plan(S,p),get S(){return S}};
}
</script>
</body>
